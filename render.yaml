services:
  - type: web
    name: csbs-timetable-backend
    env: node
    plan: free
    region: oregon
    buildCommand: npm install -g pnpm@10.26.1 && cd backend && pnpm install --frozen-lockfile && pnpm run build
    startCommand: cd backend && pnpm run start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.19.0
      - key: FRONTEND_URL
        sync: false
      # Ensure you set these values in your Render Dashboard:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

  - type: web
    env: static
    name: csbs-timetable-frontend
    buildCommand: npm install -g pnpm@10.26.1 && cd frontend && pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      # Ensure you set this value in your Render Dashboard:
      - key: VITE_VAPID_PUBLIC_KEY
        sync: false
