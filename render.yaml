services:
  - type: web
    name: csbs-timetable-backend
    env: node
    plan: free
    region: oregon
    buildCommand: cd backend && pnpm install --frozen-lockfile && pnpm run build && pnpm run seed
    startCommand: cd backend && pnpm run start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_VERSION
        value: 20.19.0
      - key: PNPM_VERSION
        value: "9.12.3"
      - key: FRONTEND_URL
        sync: false
      # Ensure you set these values in your Render Dashboard:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false

